name: jellyfin

services:
    jellyfin:
        container_name: jellyfin
        devices:
            - /dev/dri:/dev/dri
        environment:
            DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel
            PGID: "1000"
            PUID: "1000"
            TZ: America/Sao_Paulo
            JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL}
        hostname: jellyfin
        image: linuxserver/jellyfin:version-12.4ubu2604
        ports:
            - "8096:8096/tcp"
            - "7359:7359/udp"
        restart: unless-stopped
        volumes:
            - /DATA/AppData/jellyfin/config:/config
            - /DATA/AppData/jellyfin/cache:/cache
            - /DATA/Media:/Media
        networks:
            servarr:
                ipv4_address: 172.10.0.20
            newt_public:
                ipv4_address: 10.5.1.3
                ipv6_address: fd25:5000:1000:1::3

networks:
    servarr:
        external: true
    newt_public:
        external: true