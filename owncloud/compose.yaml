name: owncloud

services:
    owncloud:
        container_name: owncloud
        image: owncloud/ocis:8
        restart: unless-stopped
        entrypoint:
            - /bin/sh
        command: [ "-c", "ocis init || true; ocis server" ]
        environment:
            OCIS_URL: ${OCIS_URL:-http://localhost:9200}
            OCIS_INSECURE: "${INSECURE:-false}"
            OCIS_LOG_LEVEL: info
            PROXY_TLS: "false"
            PROXY_HTTP_ADDR: "0.0.0.0:9200"
            DEMO_USERS: "false"
            IDM_ADMIN_PASSWORD: ${OCIS_ADMIN_PASSWORD:-admin}
            TZ: America/Sao_Paulo
        user: "1000:1000"
        ports:
            - "9200:9200/tcp"
        volumes:
            - /DATA/AppData/owncloud/config:/etc/ocis
            - /DATA/Documents/owncloud:/var/lib/ocis
        networks:
            owncloud_network:
            newt_public:
                ipv4_address: 10.5.1.9
                ipv6_address: fd25:5000:1000:1::9

networks:
    owncloud_network:
        name: owncloud_network
        driver: bridge
    newt_public:
        external: true
