name: securo

x-backend-env: &backend-env
    TZ: ${TZ:-America/Sao_Paulo}
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@securo-db:5432/securo
    # Optional. Left empty, Securo generates a unique key on first start and
    # keeps it in the database. Set one (openssl rand -hex 32) to manage it yourself.
    SECRET_KEY: ${SECRET_KEY:-}
    DEBUG: ${DEBUG:-false}
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3003}
    WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
    WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Securo}
    PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
    PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
    PLUGGY_OAUTH_REDIRECT_URI: ${PLUGGY_OAUTH_REDIRECT_URI:-}
    ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
    ENABLE_BANKING_PRIVATE_KEY_FILE: ${ENABLE_BANKING_PRIVATE_KEY_FILE:-/app/secrets/enable_banking_private.pem}
    ENABLE_BANKING_API_URL: ${ENABLE_BANKING_API_URL:-https://api.enablebanking.com}
    ENABLE_BANKING_OAUTH_REDIRECT_URI: ${ENABLE_BANKING_OAUTH_REDIRECT_URI:-}
    SIMPLEFIN_ENABLED: ${SIMPLEFIN_ENABLED:-false}
    SIMPLEFIN_API_URL: ${SIMPLEFIN_API_URL:-https://beta-bridge.simplefin.org}
    OIDC_ENABLED: ${OIDC_ENABLED:-false}
    OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
    OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
    OIDC_AUTO_REGISTER: ${OIDC_AUTO_REGISTER:-true}
    OIDC_EXISTING_USER_LINK_MODE: ${OIDC_EXISTING_USER_LINK_MODE:-disabled}
    OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
    OIDC_SYNC_ROLES: ${OIDC_SYNC_ROLES:-false}
    OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-groups}
    OIDC_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-}
    OIDC_WORKSPACE_ROLE_MAP: ${OIDC_WORKSPACE_ROLE_MAP:-}
    LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
    REGISTRATION_ENABLED:
    OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
    FX_SYNC_MODE: ${FX_SYNC_MODE:-on_demand}
    TESOURO_DIRETO_ENABLED: ${TESOURO_DIRETO_ENABLED:-true}
    PLUGINS_ENABLED: ${PLUGINS_ENABLED:-false}
    PLUGINS_INDEX_URL: ${PLUGINS_INDEX_URL:-https://plugins.usesecuro.com/v1/index.json}
    PLUGINS_API_URL: ${PLUGINS_API_URL:-http://securo-backend:8000/api}
    # Set to http://securo-plugins-runner:8090 when using `--profile plugins`.
    PLUGINS_RUNNER_URL: ${PLUGINS_RUNNER_URL:-}
    PLUGINS_RUNNER_TOKEN: ${PLUGINS_RUNNER_TOKEN:-}
    # 1 hop = bundled nginx frontend; set 2 in .env when behind Pangolin/Traefik or NPM + nginx.
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    REDIS_URL: redis://securo-redis:6379/0
    BANK_SYNC_MIN_INTERVAL_HOURS: ${BANK_SYNC_MIN_INTERVAL_HOURS:-4}
    STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    STORAGE_LOCAL_PATH: /app/data/attachments
    STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
    STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
    STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
    STORAGE_S3_ALLOW_INSECURE_HTTP: ${STORAGE_S3_ALLOW_INSECURE_HTTP:-false}
    STORAGE_S3_ADDRESSING_STYLE: ${STORAGE_S3_ADDRESSING_STYLE:-auto}
    STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
    STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
    STORAGE_S3_SESSION_TOKEN: ${STORAGE_S3_SESSION_TOKEN:-}
    AGENTS_KNOWLEDGE_STORAGE_PATH: /app/data/agent_knowledge
    AGENTS_ENABLED: ${AGENTS_ENABLED:-false}
    AGENTS_BUILTIN_MCP_URL: ${AGENTS_BUILTIN_MCP_URL:-http://securo-mcp-server:8765/mcp}
    AGENTS_EXTERNAL_MCP_URL: ${AGENTS_EXTERNAL_MCP_URL:-}
    AGENTS_EXTRA_MCP_SERVERS: ${AGENTS_EXTRA_MCP_SERVERS:-}
    AGENTS_CHAT_RATE_LIMIT_PER_MINUTE: ${AGENTS_CHAT_RATE_LIMIT_PER_MINUTE:-30}
    AGENTS_MCP_JWT_SECRET: ${AGENTS_MCP_JWT_SECRET:-}
    AGENTS_MCP_EXTERNAL_TTL_DAYS: ${AGENTS_MCP_EXTERNAL_TTL_DAYS:-90}
    AGENTS_MCP_ALLOWED_ORIGINS: ${AGENTS_MCP_ALLOWED_ORIGINS:-}
    AGENTS_DEFAULT_PROVIDER: ${AGENTS_DEFAULT_PROVIDER:-ollama}
    AGENTS_DEFAULT_MODEL: ${AGENTS_DEFAULT_MODEL:-}
    AGENTS_OLLAMA_BASE_URL: ${AGENTS_OLLAMA_BASE_URL:-http://ollama:11434}
    AGENTS_OPENAI_API_KEY: ${AGENTS_OPENAI_API_KEY:-}
    AGENTS_ANTHROPIC_API_KEY: ${AGENTS_ANTHROPIC_API_KEY:-}
    AGENTS_OPENAI_COMPAT_BASE_URL: ${AGENTS_OPENAI_COMPAT_BASE_URL:-}
    AGENTS_OPENAI_COMPAT_API_KEY: ${AGENTS_OPENAI_COMPAT_API_KEY:-}
    AGENTS_EMBEDDING_PROVIDER: ${AGENTS_EMBEDDING_PROVIDER:-native}
    AGENTS_EMBEDDING_MODEL: ${AGENTS_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}

x-backend-base: &backend-base
    image: ghcr.io/securo-finance/securo-backend:latest
    restart: unless-stopped
    environment: *backend-env
    extra_hosts:
        - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "-c", 'alembic current --check-heads && exec "$$@"', "sh"]
    depends_on:
        securo-db:
            condition: service_healthy
        securo-redis:
            condition: service_healthy
        securo-migrate:
            condition: service_completed_successfully
    volumes:
        - /DATA/AppData/securo/secrets:/app/secrets:ro
        - /DATA/AppData/securo/attachments:/app/data/attachments
        - /DATA/AppData/securo/agent_knowledge:/app/data/agent_knowledge
        - /DATA/AppData/securo/agent_embedding_models:/app/data/embedding_models
    networks:
        - securo
        - securo_plugins

services:
    securo-redis:
        image: docker.io/library/redis:8-alpine
        container_name: securo-redis
        restart: unless-stopped
        command: redis-server --maxmemory 64mb --maxmemory-policy noeviction
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 128m
                reservations:
                    memory: 32m
        networks:
            - securo

    securo-db:
        image: ${DB_IMAGE:-docker.io/pgvector/pgvector:pg16}
        container_name: securo-db
        restart: unless-stopped
        shm_size: 128m
        command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB", "-c", "max_connections=50"]
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: securo
            TZ: ${TZ:-America/Sao_Paulo}
        volumes:
            - /DATA/AppData/securo/pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 512m
                reservations:
                    memory: 128m
        networks:
            - securo

    securo-migrate:
        <<: *backend-base
        container_name: securo-migrate
        restart: "no"
        entrypoint: ["alembic"]
        command: upgrade head
        depends_on:
            securo-db:
                condition: service_healthy
            securo-redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 384m

    securo-backend:
        <<: *backend-base
        container_name: securo-backend
        command: uvicorn app.main:app --host 0.0.0.0 --port 8000
        ports:
            - "${BACKEND_PORT:-8003}:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
            interval: 5s
            timeout: 6s
            start_period: 30s
            retries: 12
        deploy:
            resources:
                limits:
                    memory: 768m
                reservations:
                    memory: 256m

    securo-frontend:
        image: ghcr.io/securo-finance/securo-frontend:latest
        container_name: securo-frontend
        restart: unless-stopped
        ports:
            - "${FRONTEND_PORT:-3003}:8080"
        environment:
            TZ: ${TZ:-America/Sao_Paulo}
            BACKEND_URL: http://securo-backend:8000
            FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3003}
        depends_on:
            securo-backend:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 128m
                reservations:
                    memory: 32m
        networks:
            securo:
            newt_private:
                ipv4_address: 10.5.100.11
                ipv6_address: fd25:5000:1000:100::11

    securo-celery-worker:
        <<: *backend-base
        container_name: securo-celery-worker
        # Single worker process for 1 user to save RAM and CPU on the dual-core host.
        command: celery -A app.worker worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
        deploy:
            resources:
                limits:
                    memory: 768m
                reservations:
                    memory: 192m

    securo-celery-beat:
        <<: *backend-base
        container_name: securo-celery-beat
        command: celery -A app.worker beat --loglevel=info
        deploy:
            resources:
                limits:
                    memory: 256m
                reservations:
                    memory: 64m

    securo-mcp-server:
        <<: *backend-base
        container_name: securo-mcp-server
        profiles: [agents]
        command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8765
        ports:
            - "${AGENTS_MCP_EXTERNAL_HOST_PORT:-127.0.0.1:8765}:8765"
        deploy:
            resources:
                limits:
                    memory: 256m
                reservations:
                    memory: 64m

    securo-plugins-runner:
        image: ghcr.io/securo-finance/securo-backend:latest
        container_name: securo-plugins-runner
        profiles: [plugins]
        restart: unless-stopped
        command: uvicorn --factory plugin_runner.main:create_app --host 0.0.0.0 --port 8090
        environment:
            PLUGINS_RUNNER_TOKEN: ${PLUGINS_RUNNER_TOKEN:-}
            PLUGINS_EGRESS_SECRET: ${PLUGINS_EGRESS_SECRET:-}
            PLUGINS_EGRESS_PROXY: securo-plugins-egress:3128
            PYTHONDONTWRITEBYTECODE: "1"
        volumes:
            - /DATA/AppData/securo/plugins:/var/lib/securo-plugins
        networks:
            - securo_plugins
        read_only: true
        tmpfs: [/tmp]
        cap_drop: [ALL]
        cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
        security_opt: ["no-new-privileges:true"]
        init: true
        deploy:
            resources:
                limits:
                    pids: 512
                    memory: ${PLUGINS_RUNNER_MEMORY:-1g}
                reservations:
                    memory: 128m

    securo-plugins-egress:
        image: ghcr.io/securo-finance/securo-backend:latest
        container_name: securo-plugins-egress
        profiles: [plugins]
        restart: unless-stopped
        command: python -m plugin_runner.egress
        environment:
            PLUGINS_EGRESS_SECRET: ${PLUGINS_EGRESS_SECRET:-}
            PYTHONDONTWRITEBYTECODE: "1"
        networks:
            - securo
            - securo_plugins
        read_only: true
        cap_drop: [ALL]
        security_opt: ["no-new-privileges:true"]
        user: "65534:65534"
        deploy:
            resources:
                limits:
                    memory: 128m
                reservations:
                    memory: 32m

networks:
    securo:
        name: securo
        driver: bridge
        enable_ipv6: true
        ipam:
            driver: default
            config:
                - subnet: 10.92.1.0/24
                - subnet: fd25:9200:1000:1::/64
    securo_plugins:
        name: securo_plugins
        driver: bridge
        internal: true
    newt_private:
        external: true
